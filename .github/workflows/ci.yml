name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Version comes from package.json "packageManager"; passing it here too
      # makes pnpm/action-setup v4 fail with a duplicate-version error.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm exec eslint . --ext .js,.jsx,.cjs,.mjs,.ts,.tsx,.cts,.mts

      # A stray NUL byte (e.g. a UTF-16 fragment appended to a UTF-8 file)
      # makes GitHub treat the file as binary and render the whole README as
      # escaped plain text. Fail fast instead of shipping a broken page.
      - name: Check Markdown files are clean UTF-8
        shell: pwsh
        run: |
          $bad = @(git ls-files '*.md' | Where-Object {
            (Test-Path $_) -and ([System.IO.File]::ReadAllBytes($_) -contains 0)
          })
          if ($bad.Count -gt 0) {
            $bad | ForEach-Object { Write-Host "NUL bytes: $_" }
            Write-Error 'Markdown files contain NUL bytes and will not render on GitHub'
            exit 1
          }
          Write-Host "Markdown files are clean ($((git ls-files '*.md').Count) checked)"
