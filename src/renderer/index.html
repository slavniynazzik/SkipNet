<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>SkipNet</title>
    <!--
      CSP: `file:` is deliberately NOT allowed for images/media. Wallpapers are
      served through the `skipnet-media://` protocol, which is bound to an
      allow-list of the active wallpaper and the last Workshop scan. Arbitrary
      `file:///C:/...` images are therefore blocked by CSP even if a renderer
      compromise manages to inject one (C11 / audit P1-14).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: skipnet-media:; media-src 'self' data: blob: skipnet-media:; object-src 'none'; base-uri 'none'; form-action 'none';"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
</html>
